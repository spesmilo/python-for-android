// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
       google()
       mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        {%- for repo in args.gradle_repositories %}
        {{repo}}
        {%- endfor %}
    }
}

tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

{% if is_library %}
apply plugin: 'com.android.library'
{% else %}
apply plugin: 'com.android.application'
{% endif %}

android {
    // AGP 9 generates R into the namespace package, and no longer
    // honours aapt's --custom-package. Electrum's java sources import
    // org.electrum.electrum.res.R, while args.package varies with APP_PACKAGE_DOMAIN
    // (mainnet vs testnet), so the namespace has to stay fixed and the real package
    // is set as applicationId instead.
    namespace 'org.electrum.electrum.res'
    compileSdkVersion {{ android_api }}
    buildToolsVersion '{{ build_tools_version }}'
    defaultConfig {
        {%- if not is_library %}
        applicationId '{{ args.package }}'
        {%- endif %}
        minSdkVersion {{ args.min_sdk_version }}
        targetSdkVersion {{ args.android_target_sdk_version }}
        versionCode {{ args.numeric_version }}
        versionName '{{ args.version }}'
        manifestPlaceholders = {{ args.manifest_placeholders}}
    }

    // find aars
    repositories {
        flatDir {
            dirs 'libs' // Points to the libs directory
        }
    }
	
	packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        {% if debug_build -%}
        doNotStrip '**/*.so'
        {% else %}
        exclude 'lib/**/gdbserver'
        exclude 'lib/**/gdb.setup'
        {%- endif %}
	}
	

    signingConfigs {
        {% if debug_build -%}
        debug {
            storeFile file(System.getenv("P4A_DEBUG_KEYSTORE"))
            keyAlias System.getenv("P4A_DEBUG_KEYALIAS")
            storePassword System.getenv("P4A_DEBUG_KEYSTORE_PASSWD")
            keyPassword System.getenv("P4A_DEBUG_KEYALIAS_PASSWD")
        }
        {%- endif %}
        {% if args.sign -%}
        release {
            storeFile file(System.getenv("P4A_RELEASE_KEYSTORE"))
            keyAlias System.getenv("P4A_RELEASE_KEYALIAS")
            storePassword System.getenv("P4A_RELEASE_KEYSTORE_PASSWD")
            keyPassword System.getenv("P4A_RELEASE_KEYALIAS_PASSWD")
        }
        {%- endif %}
    }

    {% if args.packaging_options -%}
    packagingOptions {
        {%- for option in args.packaging_options %}
        {{option}}
        {%- endfor %}
    }
    {%- endif %}

    buildTypes {
        debug {
            {% if debug_build -%}
            signingConfig signingConfigs.debug
            {%- endif %}
        }
        release {
            {% if args.sign -%}
            signingConfig signingConfigs.release
            {%- endif %}
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        {%- for option in args.compile_options %}
        {{option}}
        {%- endfor %}
    }

    sourceSets {
        main {
            jniLibs.srcDir 'libs'
            java {

                {%- for adir, pattern in args.extra_source_dirs -%}
                    srcDir '{{adir}}'
                {%- endfor -%}

            }
        }
    }

    androidResources {
        noCompress "tflite", 'rcc'
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

}

dependencies {
    {%- for aar in aars %}
    implementation(name: '{{ aar }}', ext: 'aar')
    {%- endfor -%}
    {%- for jar in jars %}
    implementation files('src/main/libs/{{ jar }}')
    {%- endfor -%}
    {%- if args.depends -%}
    {%- for depend in args.depends %}
    implementation '{{ depend }}'
    {%- endfor %}
    {%- endif %}
    {% if args.presplash_lottie %}
    implementation 'com.airbnb.android:lottie:6.1.0'
    {%- endif %}
}

