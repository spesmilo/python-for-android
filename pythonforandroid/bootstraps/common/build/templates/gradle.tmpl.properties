# For tweaking memory settings. Otherwise, a p4a session
# terminates with a Java out of memory exception
org.gradle.jvmargs=-Xmx2500m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
{% if args.enable_androidx %}
android.useAndroidX=true
android.enableJetifier=true
{% endif %}

# electrum pre-installs all sdkmanager objects we need, and we don't want to pull in platform-tools
android.builder.sdkDownload=false

# The android gradle plugin has kotlin support built in, which makes the kotlin stdlib a dependency of the app.
# It would end up in the apk, also if the app has no kotlin code. This opts out of that dependency:
# https://github.com/JetBrains/kotlin/blob/c448af19ded1b1a4e96e9af6412cd9acb100ce1a/libraries/tools/kotlin-gradle-plugin/src/common/kotlin/org/jetbrains/kotlin/gradle/plugin/PropertiesProvider.kt#L363-L364
kotlin.stdlib.default.dependency=false
